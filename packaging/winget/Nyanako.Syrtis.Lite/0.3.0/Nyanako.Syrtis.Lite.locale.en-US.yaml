ShortDescription: Tray monitor for AI coding-agent token usage, cost, and subscription quota — without a bundled .NET runtime.
Description: |-
  The Lite channel of Syrtis, the Windows port of TokenBar. Identical to
  Nyanako.Syrtis except that it does not bundle the .NET 10 runtime; Velopack
  acquires the runtime at install time instead.

  Lite is the smaller download only on a machine that already has .NET 10. On a
  clean machine the download plus runtime bootstrap can approach the Full total,
  so Full remains the safe default.

  Full and Lite are not interchangeable. An installed channel cannot be switched
  without uninstalling first, and neither channel will accept the other's
  updates.
