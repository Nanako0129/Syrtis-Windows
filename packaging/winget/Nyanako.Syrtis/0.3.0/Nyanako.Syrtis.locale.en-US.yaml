ShortDescription: Tray monitor for AI coding-agent token usage, cost, and subscription quota.
Description: |-
  Syrtis is the Windows port of TokenBar. It reads the transcripts your AI coding
  agents already write to disk, prices them, and shows the result in the tray and
  a flyout: an Overview, a Quota view of what each subscription has left, plus
  Models, Monthly, Daily, Hourly, Stats and Agents views.

  Quota is read for five agent CLIs using credentials a login you performed has
  already written to disk. Nothing is uploaded; the parsing happens locally in a
  shared Rust core.

  This package is the Full channel and bundles the .NET 10 runtime. The Lite
  channel, which acquires the runtime at install time, is Nyanako.Syrtis.Lite.
  The two cannot be interchanged once installed.
Moniker: syrtis
