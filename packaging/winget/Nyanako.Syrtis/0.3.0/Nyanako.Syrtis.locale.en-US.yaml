# INCOMPLETE ON PURPOSE. `License` is a required field and is deliberately
# absent, so `winget validate` fails on this file rather than passing with a
# value nobody chose. Do not add a placeholder: a placeholder validates, and
# a manifest that validates can be submitted.
#
# The repository has no LICENSE file, so its own code is under default
# copyright. The shipped package is not purely its own code: lib/app in the
# nupkg carries tb_core_ffi.dll, built from vendor/tokscale-core, which is
# MIT (Copyright (c) 2025 Junho Yeo) and whose terms require the copyright
# and permission notice to travel with every copy. No notice file ships in
# the package today. Settling that is a prerequisite for this manifest, not
# a follow-up to it — submitting to microsoft/winget-pkgs asserts a right to
# distribute.
#
# Publisher below is the human-readable publisher for the listing. It is not
# the same string as AppsAndFeaturesEntries.Publisher in the installer
# manifest, which must mirror what v0.3.0 actually wrote to the registry.
PackageIdentifier: Nyanako.Syrtis
PackageVersion: 0.3.0
PackageLocale: en-US
Publisher: Nyanako
PublisherUrl: https://github.com/Nanako0129
PublisherSupportUrl: https://github.com/Nanako0129/Syrtis-Windows/issues
PackageName: Syrtis
PackageUrl: https://github.com/Nanako0129/Syrtis-Windows
ShortDescription: Tray monitor for AI coding-agent token usage, cost, and subscription quota.
Description: |-
  Syrtis is the Windows port of TokenBar. It reads the transcripts your AI coding
  agents already write to disk, prices them, and shows the result in the tray and
  a flyout: an Overview, a Quota view of what each subscription has left, plus
  Models, Monthly, Daily, Hourly, Stats and Agents views.

  Quota is read for five agent CLIs using credentials a login you performed has
  already written to disk. Nothing is uploaded; the parsing happens locally in a
  shared Rust core.

  This package is the Full channel and bundles the .NET 10 runtime. The Lite
  channel, which acquires the runtime at install time, is Nyanako.Syrtis.Lite.
  The two cannot be interchanged once installed.
Moniker: syrtis
Tags:
